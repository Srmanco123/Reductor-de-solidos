[package]
name = "reductor"
version = "2.0.0"
edition = "2021"
description = "Reductor de sólidos: motor nativo (lectores, reducción, exportación y archivado)"
publish = false

[[bin]]
name = "Reductor_solidos"
path = "src/main.rs"

[dependencies]
zstd = { version = "0.13", default-features = false }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
